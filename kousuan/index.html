<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>口算小达人</title>
  <meta name="theme-color" content="#ff7675">
  <meta name="description" content="一年级口算闯关游戏，从5以内到100以内逐级晋级，动画讲解凑十法、破十法、平十法">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 主页 -->
    <section id="screen-home" class="screen active">
      <div class="home-top">
        <div class="profile">
          <span class="profile-emoji" id="home-title-emoji">🌱</span>
          <div>
            <div class="profile-title" id="home-title-name">5以内</div>
            <div class="profile-level" id="home-level">第 1 关</div>
          </div>
        </div>
        <div class="points" id="home-points">⭐ 0</div>
      </div>
      <div class="home-hero">
        <div class="monster-big" id="home-monster">🐛</div>
        <button id="btn-play" class="btn-primary big">开始第 1 关</button>
      </div>
      <div class="home-foot">
        <button id="btn-select" class="btn-secondary">🎯 选关</button>
        <button id="btn-method" class="btn-secondary">📚 方法课堂</button>
        <button id="btn-mute-home" class="icon-btn">🔊</button>
        <button id="btn-reset" class="icon-btn">🔄 重新开始</button>
      </div>
    </section>

    <!-- 游戏屏幕 -->
    <section id="screen-game" class="screen">
      <div class="game-top">
        <button id="btn-back" class="icon-btn">🏠</button>
        <div class="game-progress">
          <div class="level-label" id="game-level">第 1 关</div>
          <div class="q-counter" id="game-qcounter">第 1/10 题</div>
        </div>
        <div class="points" id="game-points">⭐ 0</div>
        <button id="btn-mute-game" class="icon-btn">🔊</button>
      </div>

      <div class="monster-box">
        <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
        <div class="monster" id="game-monster">🐛</div>
        <div class="hp-text" id="hp-text">HP 10/10</div>
      </div>

      <div class="question-box">
        <span class="question-text" id="question-text">1 + 1 =</span>
        <span class="answer-display empty" id="answer-display"></span>
      </div>

      <div class="keypad" id="keypad"></div>

      <div class="game-actions">
        <button id="btn-hint" class="btn-secondary">💡 方法</button>
        <button id="btn-reset-q" class="btn-secondary">🔄 换一题</button>
      </div>
    </section>

    <!-- 选关 -->
    <section id="screen-select" class="screen">
      <div class="method-head">
        <h2>🎯 选择难度</h2>
        <p>选一个难度，直接开始闯关</p>
      </div>
      <div class="method-list" id="select-list"></div>
      <div class="home-foot">
        <button id="btn-select-back" class="btn-secondary">🏠 返回主页</button>
      </div>
    </section>

    <!-- 过关结算 -->
    <section id="screen-levelup" class="screen">
      <div class="result-card">
        <div class="result-emoji">🎉</div>
        <h2>太棒了！过关啦！</h2>
        <div class="result-rewards">
          <div>答对奖励：+<span id="result-correct-points">0</span></div>
          <div>过关奖励：+<span id="result-level-bonus">50</span></div>
        </div>
        <button id="btn-next-level" class="btn-primary big">下一关 ➡️</button>
      </div>
    </section>

    <!-- 方法课堂列表 -->
    <section id="screen-method" class="screen">
      <div class="method-head">
        <h2>📚 方法课堂</h2>
        <p>跟着动画学巧算</p>
      </div>
      <div class="method-list" id="method-list"></div>
      <div class="home-foot">
        <button id="btn-method-back" class="btn-secondary">🏠 返回主页</button>
      </div>
    </section>

    <!-- 方法详情 -->
    <section id="screen-method-detail" class="screen">
      <div class="method-detail-head">
        <span class="method-detail-emoji" id="method-detail-emoji">🤝</span>
        <div>
          <div class="method-detail-name" id="method-detail-name">凑十法</div>
          <div class="method-detail-slogan" id="method-detail-slogan">看大数，拆小数，凑成十</div>
        </div>
      </div>
      <div class="method-detail-desc" id="method-detail-desc">遇到进位加法，先把小的数拆开，凑成10，再加剩下的。</div>
      <div class="method-anim-box" id="method-detail-anim"></div>
      <div class="method-detail-actions">
        <button id="btn-method-step" class="btn-primary big btn-block">下一步 ➡️</button>
      </div>
      <div class="method-detail-actions">
        <button id="btn-method-play" class="btn-secondary">🔁 重看</button>
        <button id="btn-method-next" class="btn-secondary">🔄 换一题</button>
        <button id="btn-method-practice" class="btn-secondary">去闯关练习</button>
      </div>
      <div class="home-foot">
        <button id="btn-method-detail-back" class="icon-btn">⬅️ 返回</button>
      </div>
    </section>

    <!-- title 晋级 overlay -->
    <div id="overlay-title" class="overlay hidden">
      <div class="result-card">
        <div class="result-emoji">👑</div>
        <h2>晋级啦！</h2>
        <div class="title-badge" id="title-badge">🌟 20以内</div>
        <div class="title-reward">奖励 +<span id="title-bonus">200</span> 积分</div>
        <button id="btn-title-ok" class="btn-primary big">继续 ➡️</button>
      </div>
    </div>

    <!-- 答题内联教学方法 overlay -->
    <div id="overlay-method" class="overlay hidden">
      <div class="result-card">
        <div class="result-emoji" style="font-size:44px">💡</div>
        <div class="method-anim-box" id="method-overlay-anim"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/audio.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/methods.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
